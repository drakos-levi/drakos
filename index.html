.splash h1{font-size:2.3rem;font-weight:800;margin:0 0 4px}
.splash p{color:var(--mu);margin:0 0 22px}
.door{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:16px 18px;background:#181014e6;border:1px solid var(--line);border-radius:14px;text-align:right}
.door b{display:block;font-size:1.25rem}.door small{color:var(--mu)}
.door .i{font-size:2rem}.door.a{border-color:var(--ember)}.door.c{border-color:#4d8a5c}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0a0709f0;border-bottom:1px solid var(--line)}
header b{font-size:1.1rem}header button{background:none;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:.85rem;color:var(--mu)}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font-weight:600}
nav button.on{color:var(--gold);border-color:var(--gold)}
main{padding:14px 14px 80px;max-width:640px;margin:auto}
details.g{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
details.g>summary{padding:14px;font-weight:800;font-size:1.05rem;cursor:pointer}
.f{padding:10px 14px;border-top:1px solid var(--line)}
.fh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fh span{font-weight:600}.fh div{display:flex;gap:6px;flex-shrink:0}
.fh button{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:.85rem}
.fh .cp{background:var(--ember);border-color:var(--ember);font-weight:600}
pre{display:none;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.9rem;line-height:1.7;background:#0f0a0d;border-radius:8px;padding:12px;margin:10px 0 0;color:#e6d9d6;direction:rtl}
pre.show{display:block}
.empty{text-align:center;color:var(--mu);padding:40px 16px;border:1px dashed var(--line);border-radius:12px;line-height:1.9}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1a1008;font-weight:700;padding:9px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.emp{display:block;margin:18px auto 0;background:none;border:0;color:var(--gold);font-weight:600}
.fm{display:grid;gap:10px}.fm label{font-size:.9rem;color:var(--mu)}
.fm input{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0f0a0d;color:var(--tx);font:inherit}
.fm input[type=color]{height:46px;padding:3px}
.fm .bt{padding:12px;border-radius:10px;border:0;background:var(--ember);font-weight:800}.fm .bt.g{background:none;border:1px solid var(--line);font-weight:600}
.wh{position:relative;width:320px;max-width:100%;margin:14px auto 18px}.wh canvas{width:100%;height:auto;display:block;border-radius:50%;border:4px solid var(--gold)}
.pt{position:absolute;top:-8px;left:50%;margin-left:-13px;border:13px solid transparent;border-top:24px solid var(--gold);border-bottom:0;z-index:2}
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:0 0 auto!important;white-space:nowrap;padding:12px 15px!important}
.fm select,.fm textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0f0a0d;color:var(--tx);font:inherit}
.rc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;line-height:1.7}
.rc .tx{white-space:pre-wrap;word-break:break-word;margin-top:6px;color:#e6d9d6}.mu{color:var(--mu);font-size:.85rem}
.rc .dl{margin-top:8px;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 12px;color:var(--mu)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:8px}.dot.g{background:#2fbf5f;box-shadow:0 0 8px #2fbf5f}.dot.r{background:#e03a3a;box-shadow:0 0 8px #e03a3a}
</style></head>

if(db)un.push(db.collection(col).where('p','==',prov).onSnapshot(s=>{const L=$('#fl');if(!L)return;L.innerHTML='';const r=s.docs.slice().sort((a,b)=>b.data().t-a.data().t).slice(0,60);if(!r.length)return L.append(el('div','empty','مفيش حاجة لسه.'));r.forEach(d=>{const x=d.data(),c=el('div','rc',`<b>${esc(x.ti)}</b> <span class="mu">${ago(x.t)}</span><div class="tx">${esc(x.x)}</div>`);if(tp)c.append(delBtn(d));L.append(c)})},()=>{}))}
function access(m){const d=el('div','fm',`<h3>🔐 مين يشوف قايمة الأقسام دي؟</h3><label>الشكاوى</label><select id="vc"><option value="top">أنت واللورد فقط</option><option value="all">كل الأدمنز</option></select><label>تنظيم الأعضاء</label><select id="vo"><option value="top">أنت واللورد فقط</option><option value="all">كل الأدمنز</option></select><button class="bt" id="vs">حفظ</button>`);d.style.marginTop='22px';m.append(d);
$('#vc').value=cfg.complaints;$('#vo').value=cfg.org;$('#vs').onclick=()=>{if(!db)return noDb();db.doc('config/access').set({complaints:$('#vc').value,org:$('#vo').value}).then(()=>toast('تم الحفظ ✅')).catch(()=>toast('فشل الحفظ'))}}
function boot(){if(emp&&!PV[prov])prov='aquila';prov&&PV[prov]?home():pick()}
if(au)au.onAuthStateChanged(u=>{un.forEach(f=>f());un=[];setRole(u);if(!role)return gate();try{db.doc('config/access').onSnapshot(x=>{cfg=Object.assign({complaints:'top',org:'top'},x.exists?x.data():{})},()=>{})}catch(e){}boot()});else{role='a';boot()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
